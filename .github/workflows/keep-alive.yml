name: Keep backend alive

on:
  schedule:
    # Every 10 minutes, to stay under Render's 15-minute free tier sleep timeout
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://recetas-app-backend-r7x3.onrender.com/
